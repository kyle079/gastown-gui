name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Bridge server unit tests (Node.js matrix)
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install bridge dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # Frontend: typecheck + build + lint (all must pass — blocks merge on red)
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: web

      - name: Vite production build
        run: npm run build
        working-directory: web

      - name: ESLint (max-warnings 0)
        run: npm run lint
        working-directory: web

  # Bridge integrity checks
  bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install bridge dependencies
        run: npm ci

      - name: Verify package.json
        run: node -e "const pkg = JSON.parse(require('fs').readFileSync('./package.json','utf8')); if (!pkg.name || !pkg.version) process.exit(1);"

      - name: Verify CLI entry point
        run: |
          test -f bin/cli.js
          node bin/cli.js --help

      - name: Test server startup
        run: |
          timeout 5 node server.js &
          sleep 2
          curl -f http://127.0.0.1:7667/api/health || curl -f http://127.0.0.1:7667 || true
        env:
          PORT: 7667
