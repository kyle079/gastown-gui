# nginx config for the gastown-gui app host LXC
# Serves Vite-built static assets; proxies /api and /ws to the bridge on mayor.
#
# Install:
#   cp nginx-gastown-gui.conf /etc/nginx/sites-available/gastown-gui
#   ln -s /etc/nginx/sites-available/gastown-gui /etc/nginx/sites-enabled/
#   nginx -t && nginx -s reload
#
# The bridge (server.js) runs on the mayor LXC at 192.168.2.40:7667.
# This host only needs nginx — no Node.js required.

upstream gastown_bridge {
    server 192.168.2.40:7667;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /opt/gastown-gui/dist;
    index index.html;

    # SPA: all non-file requests fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → bridge on mayor
    location /api/ {
        proxy_pass http://gastown_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket → bridge on mayor
    location /ws {
        proxy_pass http://gastown_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
