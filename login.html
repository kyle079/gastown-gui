<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Town — Sign In</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <style>
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }

    .login-header {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 2rem;
    }

    .login-header img {
      width: 24px;
      height: 24px;
    }

    .login-header .logo-text {
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-primary);
    }

    h1 {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 1.5rem;
      letter-spacing: -0.01em;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.375rem;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--accent-primary);
    }

    .error {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      color: var(--accent-danger);
      font-size: 0.8125rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      display: none;
    }

    .error.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      background: var(--accent-primary);
      color: var(--text-inverse);
      border: none;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.5625rem 1rem;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      opacity: 0.85;
    }

    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="/assets/favicon-32.png" alt="">
      <span class="logo-text">GAS TOWN</span>
    </div>
    <h1>Sign in</h1>
    <div class="error" id="error-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });

        const data = await res.json();

        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = data.redirectTo || params.get('next') || '/';
        } else {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      } catch (err) {
        errorEl.textContent = 'Network error — please try again';
        errorEl.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
